[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herbarium-inspect-cost"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["inspect-ai==0.3.266", "openai==3.16.2", "Pillow==12.3.0"]

[project.entry-points.inspect_ai]
herbarium_cost = "openrouter_cost"

[tool.setuptools]
py-modules = ["openrouter_cost"]
